aid: crema
name: Crema
description: Crema.co is an online specialty-coffee subscription platform and curated
  marketplace that connects coffee drinkers with independent roasters. Customers take
  a preference quiz, pick a delivery cadence ranging from every few days to monthly,
  and receive freshly roasted beans by mail from a rotating selection of more than a
  thousand coffees sourced from dozens of small-batch roasters. Crema also runs a
  workplace coffee program for offices. This is a consumer e-commerce brand with no
  public developer API or developer platform; the repository is retained in the
  network for completeness and provenance.
